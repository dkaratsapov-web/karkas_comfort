<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Manrope", system-ui, sans-serif; }
    a { color: #2F5D3F; text-decoration: none; } a:hover { color: #24462F; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #17150F; color: #F4EFE7;">

  <!-- фото -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 470px; background: #2A2721; display: flex; align-items: center; justify-content: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: .45;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F4EFE7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10.5V21h14V10.5"/><path d="M10 21v-6h4v6"/></svg>
      <div style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase;">Фото объекта</div>
    </div>
  </div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 470px; background: linear-gradient(180deg, rgba(23,21,15,.85) 0%, rgba(23,21,15,.35) 45%, rgba(23,21,15,.95) 100%);"></div>

  <!-- шапка -->
  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E8DFCF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7"/><path d="M6 10v11h12V10"/></svg>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 16px;">Каркас Комфорт</div>
    </div>
    <div style="width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(244,239,231,.35); border-radius: 2px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4EFE7" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
    </div>
  </div>

  <!-- оффер: помещается до сгиба -->
  <div style="position: relative; padding: 26px 20px 0;">
    <div style="font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #C7BCA6;">Тверь и область</div>
    <h1 style="font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 34px; line-height: 1.12; margin: 12px 0 0;">Каркасный дом под ключ за 2 месяца</h1>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 22px;">
      <div style="padding: 12px 10px; background: rgba(244,239,231,.09); border-radius: 2px;">
        <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 19px;">32 000 ₽</div>
        <div style="font-size: 11px; color: #BFB5A1; margin-top: 3px;">за м² под ключ</div>
      </div>
      <div style="padding: 12px 10px; background: rgba(244,239,231,.09); border-radius: 2px;">
        <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 19px;">2 мес.</div>
        <div style="font-size: 11px; color: #BFB5A1; margin-top: 3px;">срок 100 м²</div>
      </div>
      <div style="padding: 12px 10px; background: rgba(244,239,231,.09); border-radius: 2px;">
        <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 19px;">5 лет</div>
        <div style="font-size: 11px; color: #BFB5A1; margin-top: 3px;">гарантия</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 22px;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; background: #2F5D3F; border-radius: 2px; font-size: 16px; font-weight: 600; color: #FFFDF9;">
        Рассчитать мой дом
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFDF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; height: 52px; border: 1px solid rgba(244,239,231,.45); border-radius: 2px; font-size: 15px;">15 готовых проектов</div>
    </div>
  </div>

  <!-- начало следующей секции: видно, что дальше есть проекты -->
  <div style="position: absolute; left: 0; right: 0; bottom: 76px; padding: 18px 20px 0; background: #F4EFE7; color: #17150F; border-radius: 14px 14px 0 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 20px;">Готовые проекты</div>
      <div style="font-size: 13px; color: #2F5D3F; font-weight: 600;">Все 15 →</div>
    </div>
    <div style="display: flex; gap: 10px; margin-top: 12px;">
      <div style="flex-grow: 1; height: 60px; background: #E4DBCC; border-radius: 3px;"></div>
      <div style="flex-grow: 1; height: 60px; background: #E4DBCC; border-radius: 3px;"></div>
    </div>
  </div>

  <!-- нижняя панель действий: не перекрывает контент, под неё зарезервирован отступ -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #D8CFBE; border-top: 1px solid #D8CFBE;">
    <div style="background: #FFFDF9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #17150F;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#17150F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h3l1.5 4.5-2 1.5a12 12 0 0 0 6 6l1.5-2 4.5 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4.5 5.2 2 2 0 0 1 6.5 3z"/></svg>
      <div style="font-size: 11px;">Позвонить</div>
    </div>
    <div style="background: #FFFDF9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #17150F;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#17150F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.4-.7L3 21l1.9-5.2A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>
      <div style="font-size: 11px;">Написать</div>
    </div>
    <div style="background: #2F5D3F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #FFFDF9;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFDF9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8"/><path d="M8 12h3"/><path d="M8 16h3"/></svg>
      <div style="font-size: 11px; font-weight: 600;">Рассчитать</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
