# Проверка сайта перед выкладкой.
#
# Раньше этот workflow публиковал демо на GitHub Pages. После перевода
# репозитория в приватный Pages стали недоступны (на бесплатном тарифе
# страницы приватных репозиториев не публикуются), и демо отключено.
# Проверки остались: они ловят ошибки до того, как их увидят посетители.
#
# Выгрузка на боевой сервер («Deploy to VPS») запускается после успешного
# завершения этого workflow.

name: Проверка сайта

on:
  push:
    # Рабочая ветка сюда не входит: публикация пушит тот же коммит
    # в обе ветки, и проверка шла дважды — дубль только тратил минуты.
    branches:
      - claude/karkas-comfort-redesign-0zy3xi
      - main
    paths-ignore:
      - 'README.md'
      - 'DEPLOY.md'
      - 'docs/**'
      # Сырьё от заказчика: в сборку не входит, проверять незачем.
      - 'materials/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Четыре задания на четырёх машинах одновременно: сценарии и SEO
  # и три трети визуальной проверки. Раньше всё шло одним заданием
  # на двух ядрах — 7,5 минуты; «Deploy to VPS» ждёт, пока пройдут все.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: 'сценарии и SEO', parts: 'check,seo', shard: '1/1' }
          - { name: 'визуальная 1/3', parts: 'visual', shard: '1/3' }
          - { name: 'визуальная 2/3', parts: 'visual', shard: '2/3' }
          - { name: 'визуальная 3/3', parts: 'visual', shard: '3/3' }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Браузер для проверок
        run: |
          # npx playwright install кладёт только браузер, сам пакет остаётся
          # вне node_modules — и проверки падают на импорте playwright.
          # Поэтому ставим пакет рядом, не трогая package.json.
          #
          # Версия закреплена нарочно: 5 ноября в реестре появился
          # playwright 1.65.0 без playwright-core 1.65.0, и установка
          # без версии падала с ETARGET — проверки не запускались, а
          # с ними останавливалась и выгрузка на сервер.
          npm i --no-save playwright@1.64.1
          npx playwright install --with-deps chromium

      # Водяные знаки: кеш по содержимому кадров переживает запуски,
      # иначе каждая сборка заново пережимала все фото (1,5 минуты).
      - name: Кеш водяных знаков
        uses: actions/cache@v4
        with:
          path: .cache/watermark
          key: wm-${{ hashFiles('assets/img/**', 'tools/watermark.mjs') }}
          restore-keys: wm-

      - name: Сборка
        run: npm run build

      - name: Проверка, что сборка не пустая
        run: |
          test -s dist/index.html
          test -s dist/assets/css/style.css
          test -s dist/sitemap.xml

      - name: Проверки сайта
        run: npm run verify
        env:
          VERIFY_PARTS: ${{ matrix.parts }}
          VISUAL_SHARD: ${{ matrix.shard }}
