# Демонстрационная версия сайта на GitHub Pages.
# Адрес: https://<владелец>.github.io/<репозиторий>/
# Обновляется автоматически при каждом пуше в рабочую ветку.

name: Preview site

on:
  push:
    branches:
      - claude/karkas-comfort-redesign-0zy3xi
      - main
    paths-ignore:
      - 'README.md'
      - 'DEPLOY.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Настройка Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Сборка демо-версии
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
        run: npm run preview

      - name: Проверка сборки
        run: |
          test -s preview/index.html
          test -s preview/assets/css/style.css
          grep -q "noindex" preview/index.html
          grep -q "Disallow: /" preview/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview

      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
