# Проверка сайта перед выкладкой.
#
# Раньше этот workflow публиковал демо на GitHub Pages. После перевода
# репозитория в приватный Pages стали недоступны (на бесплатном тарифе
# страницы приватных репозиториев не публикуются), и демо отключено.
# Проверки остались: они ловят ошибки до того, как их увидят посетители.
#
# Выгрузка на боевой сервер («Deploy to VPS») запускается после успешного
# завершения этого workflow.

name: Проверка сайта

on:
  push:
    branches:
      - claude/karkas-comfort-redesign-0zy3xi
      - claude/site-analysis-redesign-tfso59
      - main
    paths-ignore:
      - 'README.md'
      - 'DEPLOY.md'
      - 'docs/**'
      # Сырьё от заказчика: в сборку не входит, проверять незачем.
      - 'materials/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Браузер для проверок
        run: |
          # npx playwright install кладёт только браузер, сам пакет остаётся
          # вне node_modules — и проверки падают на импорте playwright.
          # Поэтому ставим пакет рядом, не трогая package.json.
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Сборка
        run: npm run build

      - name: Проверка, что сборка не пустая
        run: |
          test -s dist/index.html
          test -s dist/assets/css/style.css
          test -s dist/sitemap.xml

      - name: Проверки сайта
        run: npm run verify
