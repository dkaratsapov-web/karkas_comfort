# Выгрузка сайта на VPS по SSH (rsync).
#
# Работает сама: как только «Preview site» успешно собрал демо, этот
# workflow выкладывает ту же версию на сервер. Руками ничего запускать
# не нужно; ручной запуск оставлен для перезаливки без новой правки.
#
# ОДИН РАЗ добавьте доступы: Settings → Secrets and variables → Actions
#   VPS_HOST     IP сервера
#   VPS_USER     deploy
#   VPS_SSH_KEY  приватный ключ (целиком, вместе со строками BEGIN/END)
#   VPS_PATH     /var/www/<домен>/public
#   VPS_PORT     22 — только если SSH висит на другом порту (необязательно)
#
# Пока секретов нет, workflow не падает: пишет, чего не хватает, и
# завершается успехом. Сервер готовится скриптом server/bootstrap.sh.

name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Preview site"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать, что изменится"
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Проверка доступов
        id: gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || { [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; }; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Доступы к серверу не заданы — выгрузка пропущена. Нужны VPS_HOST, VPS_USER, VPS_PATH и один из двух: VPS_SSH_KEY или VPS_PASSWORD."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Сборка боевой версии
        if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - name: Проверка, что сборка не пустая
        if: steps.gate.outputs.ready == 'true'
        run: |
          test -s dist/index.html
          test -s dist/assets/css/style.css
          test -s dist/sitemap.xml
          grep -q "xn--80aa2abbmnbmggrx.xn--p1ai" dist/sitemap.xml

      - name: Доступ к серверу
        if: steps.gate.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # Подключаться можно ключом или паролем. Пароль нужен там, где
          # ключ взять неоткуда: его видно в панели хостинга, и владелец
          # вставляет его в секрет из браузера, не заходя на сервер.
          # Дальше все шаги ходят через обёртки ~/sshw и ~/scpw и не знают,
          # каким способом установлено соединение.
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          MODE=""

          if [ -n "$VPS_SSH_KEY" ]; then
            # ключ принимается как есть и одной строкой в base64: при копировании
            # многострочного ключа переносы часто склеиваются
            if printf '%s' "$VPS_SSH_KEY" | grep -q 'BEGIN .*PRIVATE KEY'; then
              printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
            else
              printf '%s' "$VPS_SSH_KEY" | tr -d ' \n' | base64 -d > ~/.ssh/id_deploy 2>/dev/null || true
            fi
            chmod 600 ~/.ssh/id_deploy
            if ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
              MODE=key
              echo "Подключение ключом, отпечаток: $(ssh-keygen -lf ~/.ssh/id_deploy | awk '{print $2}')"
            else
              rm -f ~/.ssh/id_deploy
              echo "::warning::VPS_SSH_KEY не читается как приватный ключ — пробую пароль."
            fi
          fi

          if [ -z "$MODE" ] && [ -n "$VPS_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            printf '%s' "$VPS_PASSWORD" > ~/.sshpass
            chmod 600 ~/.sshpass
            MODE=password
            echo "Подключение паролем."
          fi

          if [ -z "$MODE" ]; then
            echo "::error::Нет рабочего доступа к серверу: ключ не читается, пароль не задан. Добавьте секрет VPS_PASSWORD (пароль root из панели хостинга) или исправьте VPS_SSH_KEY."
            exit 1
          fi

          PORT="${VPS_PORT:-22}"
          if [ "$MODE" = key ]; then
            printf '#!/usr/bin/env bash\nexec ssh -i ~/.ssh/id_deploy -p %s -o StrictHostKeyChecking=yes "$@"\n' "$PORT" > ~/sshw
            printf '#!/usr/bin/env bash\nexec scp -i ~/.ssh/id_deploy -P %s -o StrictHostKeyChecking=yes "$@"\n' "$PORT" > ~/scpw
          else
            printf '#!/usr/bin/env bash\nexec sshpass -f ~/.sshpass ssh -p %s -o StrictHostKeyChecking=accept-new "$@"\n' "$PORT" > ~/sshw
            printf '#!/usr/bin/env bash\nexec sshpass -f ~/.sshpass scp -P %s -o StrictHostKeyChecking=accept-new "$@"\n' "$PORT" > ~/scpw
          fi
          chmod +x ~/sshw ~/scpw
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        id: access

      - name: Кто пускает на сервер
        if: steps.gate.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          # Пароль, который видно в панели хостинга, — это пароль root.
          # В секрете VPS_USER мог остаться deploy с прошлого сервера,
          # а у него пароля нет вовсе, и паролем он не войдёт никогда.
          # Поэтому пробуем указанного пользователя и root, дальше ходим
          # тем, кто пустил: владельцу не нужно угадывать логин.
          ok=""
          for u in "$VPS_USER" root; do
            [ -n "$u" ] || continue
            if out=$(~/sshw -o ConnectTimeout=15 -o NumberOfPasswordPrompts=1 "$u@$VPS_HOST" 'echo ПУСТИЛ $(id -un)' 2>&1); then
              case "$out" in *ПУСТИЛ*) ok="$u"; echo "$out"; break ;; esac
            fi
            echo "Пользователь $u не пустил: $(printf '%s' "$out" | tail -2 | tr '\n' ' ')"
          done

          if [ -z "$ok" ]; then
            echo "::error::Сервер не пускает ни указанного пользователя, ни root с паролем из секрета VPS_PASSWORD. Проверьте в панели хостинга адрес сервера (секрет VPS_HOST) и пароль root (секрет VPS_PASSWORD) — пароль там можно задать заново кнопкой «Сменить пароль». Секрет VPS_USER лучше задать как root, а нерабочий VPS_SSH_KEY удалить."
            exit 1
          fi

          echo "SSH_USER=$ok" >> "$GITHUB_ENV"
          TARGET="${VPS_PATH:-/var/www/xn--80aa2abbmnbmggrx.xn--p1ai/public}"
          ~/sshw "$ok@$VPS_HOST" "mkdir -p '$TARGET' && echo 'каталог на сервере готов: $TARGET'"

      - name: Выгрузка на сервер
        if: steps.gate.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          TARGET="${VPS_PATH:-/var/www/xn--80aa2abbmnbmggrx.xn--p1ai/public}"
          # --delete убирает с сервера то, чего больше нет в сборке,
          # но config.php с боевой почтой и накопленные заявки не трогаем
          rsync -az --delete ${{ inputs.dry_run && '--dry-run --itemize-changes' || '' }} \
            --exclude 'api/config.php' \
            --exclude 'api/leads.csv' \
            --exclude 'api/leads.jsonl' \
            --exclude 'api/leads-state.json' \
            --exclude 'api/settings.json' \
            --exclude 'api/admin-*' \
            -e ~/sshw \
            dist/ "${SSH_USER:-$VPS_USER}@$VPS_HOST:$TARGET/"

      - name: Права на состояние админки
        if: steps.gate.outputs.ready == 'true' && !inputs.dry_run
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # Админка и приём заявок работают от php (www-data), а файлы
          # в api/ принадлежат пользователю выгрузки. Без группового
          # доступа php не смог бы завести ни пользователей, ни заявки.
          TARGET="${VPS_PATH:-/var/www/xn--80aa2abbmnbmggrx.xn--p1ai/public}"
          ~/sshw "${SSH_USER:-$VPS_USER}@$VPS_HOST" "
              [ \"\$(id -u)\" = 0 ] && chown -R root:www-data '$TARGET/api' 2>/dev/null || true
              chmod 2775 '$TARGET/api' 2>/dev/null || true
              for f in settings.json leads.jsonl leads-state.json admin-users.json admin-throttle.json; do
                [ -f '$TARGET/api/'\$f ] && chmod 660 '$TARGET/api/'\$f || true
              done
              ls -ld '$TARGET/api'
            " || echo '::warning::Не удалось поправить права на api/ — админка может не сохранять данные.'

      - name: Сертификат
        if: steps.gate.outputs.ready == 'true' && !inputs.dry_run
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          CERT_EMAIL: ${{ secrets.CERT_EMAIL }}
        run: |
          # Сертификат выпускается сам, как только домен начинает смотреть
          # на этот сервер. Нужен доступ от root: под обычным пользователем
          # выгрузки шаг тихо пропускается.
          D=xn--80aa2abbmnbmggrx.xn--p1ai
          TARGET="${VPS_PATH:-/var/www/$D/public}"
          EMAIL="${CERT_EMAIL:-admin@$D}"
          ~/sshw "${SSH_USER:-$VPS_USER}@$VPS_HOST" "
              if [ \"\$(id -u)\" != 0 ]; then echo 'нет прав root — пропускаю'; exit 0; fi
              if [ -f /etc/letsencrypt/live/$D/fullchain.pem ]; then
                echo 'сертификат уже есть, годен до:' \$(openssl x509 -enddate -noout -in /etc/letsencrypt/live/$D/fullchain.pem | cut -d= -f2)
                exit 0
              fi
              if ! command -v certbot >/dev/null; then echo 'certbot не установлен — пропускаю'; exit 0; fi
              certbot certonly --webroot -w '$TARGET' -d $D -d www.$D --agree-tos -m '$EMAIL' -n \
                && ln -sf /etc/nginx/sites-available/$D.conf /etc/nginx/sites-enabled/$D.conf \
                && nginx -t && systemctl reload nginx && systemctl enable --now certbot.timer \
                && echo 'сертификат выпущен' \
                || echo 'сертификат пока не выпускается: домен ещё не смотрит на этот сервер'
            "

      - name: Доставка заявок в MAX
        if: steps.gate.outputs.ready == 'true' && !inputs.dry_run
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          MAX_USER_ID: ${{ secrets.MAX_USER_ID }}
        run: |
          # Токен бота MAX живёт в секретах GitHub, а не в репозитории.
          # Этот шаг переносит его в api/settings.json на сервере, чтобы
          # заявки уходили в MAX без правки файлов по SSH руками.
          if [ -z "$MAX_TOKEN" ]; then
            echo "::notice::Секрет MAX_TOKEN не задан — доставка в MAX не настраивается."
            exit 0
          fi
          TARGET="${VPS_PATH:-/var/www/xn--80aa2abbmnbmggrx.xn--p1ai/public}"
          ~/sshw "${SSH_USER:-$VPS_USER}@$VPS_HOST" "cat '$TARGET/api/settings.json' 2>/dev/null || echo '{}'" > now.json
          jq --arg t "$MAX_TOKEN" --arg c "$MAX_CHAT_ID" --arg u "$MAX_USER_ID" \
             '. + {max_token: $t, max_chat_id: $c, max_user_id: $u}' now.json > next.json
          ~/scpw next.json "${SSH_USER:-$VPS_USER}@$VPS_HOST:/tmp/kk-settings.json"
          ~/sshw "${SSH_USER:-$VPS_USER}@$VPS_HOST" "install -m 660 -g www-data /tmp/kk-settings.json '$TARGET/api/settings.json' && rm -f /tmp/kk-settings.json"
          rm -f now.json next.json
          echo "Доставка в MAX настроена: получатель ${MAX_CHAT_ID:+чат}${MAX_USER_ID:+ личный диалог}."

      - name: Сайт открывается
        if: steps.gate.outputs.ready == 'true' && !inputs.dry_run
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          D=xn--80aa2abbmnbmggrx.xn--p1ai
          SITE=https://$D/
          echo "домен указывает на: $(getent hosts $D | awk '{print $1}' | tr '\n' ' ')"
          code=$(curl -s -o /tmp/page.html -w '%{http_code}' --max-time 25 -L "$SITE" || true)
          echo "Ответ сайта: $code"
          if [ "$code" = "200" ]; then
            grep -q "Каркас Комфорт" /tmp/page.html \
              && echo "Главная отдаётся и содержит название компании." \
              || echo "::warning::Страница открылась, но названия компании в ней нет — проверьте, что выгрузилась нужная сборка."
            # сверка версии: домен может отдавать прежний сервер, и тогда
            # «200 и всё на месте» — это старая копия сайта, а не выгруженная
            MINE=$(grep -o 'style\.css?v=[0-9a-f]*' dist/index.html | head -1)
            THEIRS=$(grep -o 'style\.css?v=[0-9a-f]*' /tmp/page.html | head -1)
            if [ -n "$MINE" ] && [ "$MINE" != "$THEIRS" ]; then
              echo "::warning::Домен отдаёт не эту сборку (на сайте $THEIRS, выгружено $MINE). Скорее всего адреса домена ещё ведут на прежний сервер: в панели домена A-записи @ и www должны указывать на адрес из секрета VPS_HOST. До переключения не выпустится и сертификат."
            else
              echo "Домен отдаёт именно выгруженную сборку ($MINE)."
            fi
            # разделы и статика: ловим случай, когда главная цела, а внутренние
            # адреса уводит редиректом или в 404
            bad=0
            for u in /proekty/ /obekty/ /stati/ /kontakty/ /video/ /sitemap.xml /assets/css/style.css; do
              c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --max-redirs 0 "https://xn--80aa2abbmnbmggrx.xn--p1ai$u" || true)
              printf '  %-26s %s\n' "$u" "$c"
              [ "$c" = "200" ] || bad=1
            done
            [ "$bad" = "0" ] && echo "Все проверенные адреса отдаются." \
              || echo "::warning::Не все адреса отвечают 200 — список выше."
            # ролики: смотрим не только код ответа, но и тип — браузер не
            # возьмётся играть файл, отданный как application/octet-stream
            VID=$(ls dist/assets/video/*.mp4 2>/dev/null | head -1 | sed 's|^dist||')
            if [ -n "$VID" ]; then
              vinfo=$(curl -sI -o /dev/null -w '%{http_code} %{content_type}' --max-time 25 "https://xn--80aa2abbmnbmggrx.xn--p1ai$VID" || true)
              echo "  ролик $VID → $vinfo"
              case "$vinfo" in 200\ video/mp4*) ;; *) echo "::warning::Ролик отдаётся не как видео ($vinfo) — на сайте он не заиграет." ;; esac
            fi
            exit 0
          fi
          echo "::warning::Домен не ответил 200 — файлы выгружены, но отдаёт их сервер неправильно. Ниже разбор."
          echo "--- цепочка ответов ---"
          curl -s -o /dev/null -D - --max-time 25 --max-redirs 5 -L "$SITE" \
            | grep -i -E '^HTTP/|^location:' || true
          echo "--- что видно на сервере ---"
          TARGET="${VPS_PATH:-/var/www/$D/public}"
          ~/sshw "${SSH_USER:-$VPS_USER}@$VPS_HOST" "
              echo 'каталог: $TARGET'
              ls -la '$TARGET' | head -15
              echo 'начало index.html:'
              head -c 160 '$TARGET/index.html'; echo
              echo 'ответ самого nginx, минуя интернет:'
              curl -s -o /dev/null -w 'http  %{http_code} -> %{redirect_url}\n' \
                --resolve $D:80:127.0.0.1 http://$D/ || true
              curl -sk -o /dev/null -w 'https %{http_code} -> %{redirect_url}\n' \
                --resolve $D:443:127.0.0.1 https://$D/ || true
              echo 'когда менялась конфигурация и что в ней:'
              ls -la --time-style=+%d.%m-%H:%M /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null || true
              echo 'правил с проверкой внешнего запроса (в новом шаблоне их 3):'
              grep -c 'request_uri ~' /etc/nginx/sites-available/$D.conf 2>/dev/null || true
              grep -nE 'index index.html|request_uri ~|try_files|location = /index.html' /etc/nginx/sites-available/$D.conf 2>/dev/null | head -12 || true
              echo 'заголовки ответа на главную:'
              curl -sk -D - -o /dev/null --max-redirs 0 --resolve $D:443:127.0.0.1 https://$D/ | grep -iE '^HTTP/|^location:|^server:|^cache-control:' || true
              echo 'включённые сайты:'
              ls -1 /etc/nginx/sites-enabled/ 2>/dev/null || true
              grep -h -E 'server_name|root |listen ' /etc/nginx/sites-enabled/* 2>/dev/null | sed 's/^[[:space:]]*//' || true
            " || true

      - name: Убрать доступы
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.sshpass ~/sshw ~/scpw
