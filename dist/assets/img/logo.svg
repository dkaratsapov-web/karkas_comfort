<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150" role="img" aria-label="Каркас Комфорт">
  <title>Каркас Комфорт</title>
  <g fill="none" stroke="#F5A623" stroke-width="13" stroke-linecap="square">
    <!-- скаты кровли с выносом стропил -->
    <path d="M42 78 L150 12 L258 78"/>
    <!-- стойки каркаса -->
    <path d="M70 96 L70 30"/>
    <path d="M230 96 L230 30"/>
    <!-- боковые стены -->
    <path d="M42 96 L42 60"/>
    <path d="M258 96 L258 60"/>
  </g>
  <!-- окно во фронтоне -->
  <g fill="#F5A623">
    <rect x="136" y="52" width="12" height="12" rx="2"/>
    <rect x="154" y="52" width="12" height="12" rx="2"/>
    <rect x="136" y="70" width="12" height="12" rx="2"/>
    <rect x="154" y="70" width="12" height="12" rx="2"/>
  </g>
  <g font-family="Nunito, 'Trebuchet MS', sans-serif" text-anchor="middle">
    <text x="150" y="126" font-size="34" font-weight="800" letter-spacing="1.5" fill="#F5A623">КАРКАС</text>
    <text x="150" y="150" font-size="27" font-weight="600" letter-spacing="2.5" fill="#F9BE63">КОМФОРТ</text>
  </g>
</svg>
