<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Каркас Комфорт">
  <title>Каркас Комфорт</title>
  <!-- тёмный квадрат со скруглением: знак читается и на светлой, и на тёмной вкладке -->
  <rect width="512" height="512" rx="112" fill="#17150F"/>
  <!-- каркас дома: скаты, стойки и стены, как в логотипе -->
  <g fill="none" stroke="#F5A623" stroke-width="34" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M112 268 L256 118 L400 268"/>
    <path d="M168 386 L168 214"/>
    <path d="M344 386 L344 214"/>
    <path d="M112 386 L112 300"/>
    <path d="M400 386 L400 300"/>
  </g>
  <!-- окно во фронтоне -->
  <g fill="#F5A623">
    <rect x="222" y="216" width="30" height="30" rx="5"/>
    <rect x="262" y="216" width="30" height="30" rx="5"/>
    <rect x="222" y="256" width="30" height="30" rx="5"/>
    <rect x="262" y="256" width="30" height="30" rx="5"/>
  </g>
</svg>
